name = "gametuoitho-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Serve the API on the same origin as the SPA (Pages apex) so the frontend's
# relative `/api/...` calls work without CORS or code changes. Pages keeps the
# apex for everything else; `/api/*` (and www) hit this Worker.
routes = [
  "gametuoitho.space/api/*",
  "www.gametuoitho.space/api/*",
]

# After `npx wrangler d1 create gametuoitho-db`, paste the printed database_id here.
[[d1_databases]]
binding = "DB"
database_name = "gametuoitho-db"
database_id = "a2f4770f-681a-4059-b0c0-69afdede5104"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "MATCH_DO"
class_name = "MatchDO"

[[durable_objects.bindings]]
name = "MATCHMAKING_DO"
class_name = "MatchmakingDO"

[[durable_objects.bindings]]
name = "GAMESERVER_DO"
class_name = "GameServerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO", "MatchmakingDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GameServerDO"]

# Anti-spam: per-IP rate limit on auth endpoints (10 req / 60s).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Production values — `wrangler deploy` ships these. Local `wrangler dev`
# overrides them via worker/.dev.vars (copy from worker/.dev.vars.example).
[vars]
CORS_ORIGIN = "https://gametuoitho.space"
APP_URL = "https://gametuoitho.space"
# AI provider config (non-secret). OPENAI_API_KEY stays a secret (set via
# `npx wrangler secret put OPENAI_API_KEY`).
OPENAI_MODEL = "MiniMax-M3"
OPENAI_BASE_URL = "https://api.minimax.io/v1"
# Google OAuth Client ID (Google Cloud Console → APIs & Services → Credentials).
# Set this + the frontend VITE_GOOGLE_CLIENT_ID to enable "Sign in with Google".
# Public value (embedded in the client too) — not a secret.
GOOGLE_CLIENT_ID = "1037610366569-vfi2uh8sfhqd9qlfj4orgjobutfj044c.apps.googleusercontent.com"
# Brevo transactional email (sender). BREVO_API_KEY stays a Worker secret.
BREVO_SENDER_EMAIL = ""
BREVO_SENDER_NAME = "Game Tuổi Thơ"
